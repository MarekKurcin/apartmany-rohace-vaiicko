<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e5631;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6a4f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Pozadie -->
  <rect width="100" height="100" rx="15" fill="url(#skyGrad)"/>
  <!-- Hora vzadu -->
  <polygon points="10,75 40,35 70,75" fill="#40916c"/>
  <!-- Hora vpredu -->
  <polygon points="30,75 60,30 90,75" fill="#52b788"/>
  <!-- Sneh na vrchole -->
  <polygon points="55,35 60,30 65,35 60,40" fill="#ffffff"/>
  <!-- Domček -->
  <rect x="35" y="55" width="30" height="20" fill="#f4a261"/>
  <!-- Strecha -->
  <polygon points="30,55 50,40 70,55" fill="#e76f51"/>
  <!-- Dvere -->
  <rect x="45" y="60" width="10" height="15" fill="#6d4c41"/>
  <!-- Okno -->
  <rect x="55" y="58" width="7" height="7" fill="#fff3e0"/>
</svg>
